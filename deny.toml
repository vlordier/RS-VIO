# Cargo-deny configuration for RS-VIO
# Policy enforcement for dependencies
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (via rerun -> indicatif)
    "RUSTSEC-2024-0436",  # paste unmaintained (via apex-solver/rerun deps)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = [
    # nalgebra has multiple versions due to compatibility requirements
    { name = "nalgebra", version = "=0.33" },
    { name = "nalgebra", version = "=0.34" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Allow only these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow only these git sources
allow-git = [
    "https://github.com/charleshamesse/RS-VIO",
    "https://github.com/amin-abouee/apex-solver",
]
