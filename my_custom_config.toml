platform = "Custom"
enable_imu = true
enable_loop_closure = true
enable_bundle_adjustment = true

[performance]
target_fps = 25.0
max_latency_ms = 33.0
max_cpu_usage = 0.75
max_memory_mb = 512
enable_gpu = false

[fusion]
strategy = "RotationOnly"
num_frames = 4

[fusion.stabilizer]
buffer_size = 4
accumulation_weight = 0.800000011920929
enabled = true
min_rotation_threshold = 0.0010000000474974513

[detection]
backend = "ShiTomasi"
tracking_strategy = "TrackFirst"
min_quality = 0.009999999776482582
use_pyramid = true
pyramid_levels = 3
enforce_spatial_distribution = true
grid_cell_size = 32

[detection.track_first]
min_features = 150
max_features = 250
grid_cell_size = 32
min_features_per_cell = 2
corner_quality_threshold = 0.008
min_feature_distance = 20.0

[matching]
descriptor_type = "Orb"
keyframes_only = true
max_descriptor_distance = 50.0
use_ratio_test = true
ratio_test_threshold = 0.800000011920929

[stereo]
baseline = 0.10999999940395355
max_disparity = 128
subpixel_refinement = true
cost_window_size = 5
uniqueness_ratio = 0.15000000596046448
texture_threshold = 10.0
