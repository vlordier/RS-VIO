# Pre-commit hooks configuration for RS-VIO
# Install with: pre-commit install
# See: https://pre-commit.com/
#
# This configuration is aligned with the GitHub Actions CI in .github/workflows/
# Run quality pipeline locally: ./scripts/run_quality.sh --quick

repos:
  # ========================================================================
  # RUST TOOLS
  # ========================================================================

  # Rust formatting with rustfmt
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt (check)
        description: Format Rust code with rustfmt
        entry: rustfmt --edition 2021 --check
        language: system
        types: [rust]
        stages: [pre-commit]

  # Linting with clippy
  - repo: local
    hooks:
      - id: clippy
        name: cargo clippy
        description: Lint Rust code with clippy
        entry: cargo clippy --lib --bins -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

  # Check Cargo.toml sorting (cargo-sort)
  - repo: local
    hooks:
      - id: cargo-sort
        name: cargo sort check
        description: Check Cargo.toml ordering
        entry: cargo sort --check .
        language: system
        pass_filenames: false
        files: ^Cargo\.toml$
        stages: [pre-commit]

  # ========================================================================
  # TYPOS CHECKER
  # ========================================================================

  # Spelling check with typos
  - repo: https://github.com/crate-ci/typos
    rev: v1
    hooks:
      - id: typos
        args: [--format, brief]
        stages: [pre-commit]

  # ========================================================================
  # SECURITY TOOLS
  # ========================================================================

  # Security audit with cargo-deny
  - repo: local
    hooks:
      - id: cargo-deny-audit
        name: cargo deny check
        description: Check crate dependencies for known vulnerabilities
        entry: cargo deny check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: Cargo.lock
        stages: [pre-push]

  # ========================================================================
  # GENERAL PRE-COMMIT HOOKS
  # ========================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Identify files that would conflict in merge
      - id: check-merge-conflict

      # Prevent giant files from being committed
      - id: check-added-large-files
        args: ['--maxkb=5000']

      # Fix end of file newlines
      - id: end-of-file-fixer

      # Trim trailing whitespace
      - id: trailing-whitespace

      # Check YAML files
      - id: check-yaml

      # Check TOML files
      - id: check-toml

      # Validate JSON files
      - id: check-json

      # Check that files parse as valid Python (if any)
      - id: check-ast

  # ========================================================================
  # PYTHON + NOTEBOOK LINTING
  # ========================================================================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        name: ruff (python + notebooks)
        files: \.(py|ipynb)$

  # Conventional commit linting
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

# Exclude patterns (won't run pre-commit on these)
exclude: |
  (?x)^(
    Cargo.lock|
    target/|
    \.git/|
    fuzz_targets/|
    benches/.*|
    models/.*|
    data/.*
  )

# Minimum pre-commit version
minimum_pre_commit_version: '2.15.0'

# ========================================================================
# HOOK STAGES EXPLANATION
# ========================================================================
#
# stages: [commit]      - Runs on every commit (fast: fmt, clippy, typos, basic checks)
# stages: [commit-msg]  - Runs on commit messages (conventional commits)
# stages: [pre-push]    - Runs before pushing (security audits)
#
# For full quality pipeline, run manually:
#   ./scripts/run_quality.sh
#
# CI equivalent:
#   .github/workflows/rust.yml   - Core CI (every PR)
#   .github/workflows/quality.yml - Full quality (weekly/scheduled)
# ========================================================================
