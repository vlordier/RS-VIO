[package]
name = "rs-vio"
version = "0.1.0"
edition = "2021"

[features]
default = ["matching-basic-ransac"]
# Feature flag for 32-bit float operations (f32) instead of f64
use_f32 = []
# Feature flag for Rerun.io 3D visualization (built-in, always available)
rerun-viewer = []
# Feature flag for LightGlue ONNX-based verification
lightglue = ["ort", "ndarray"]
# Feature flag for neural network position refinement (ONNX Runtime)
onnx-refinement = ["ort", "ndarray"]
# Feature flag for memory profiling with dhat
dhat-heap = []
# Feature flag for GPU acceleration framework (placeholder for future CUDA/OpenCL support)
gpu = ["wgpu", "pollster", "wgpu/spirv"]
# Feature flag to enable debug/trace logging in hot paths (default off)
debug-logging = []

# === Swarm & Distributed Features ===
# Enable full telemetry and health monitoring for fleet operations
full-telemetry = []
# Enable distributed system types (drone swarms, consensus, etc.)
distributed = []
# Enable both telemetry and distributed features
swarm = ["full-telemetry", "distributed"]
# Enable health checks and readiness probes
health-checks = []

# === Platform-Specific Optimizations ===
# Enable embedded system optimizations (thread pinning, etc.)
embedded = []
# Enable Jetson-specific configurations and optimizations
jetson-optimized = ["embedded"]

# Stereo matching strategies - only one should be enabled per build
# Basic RANSAC: 1000 iterations, standard 8-point algorithm (baseline, default)
matching-basic-ransac = []
# IMU-guided: Predictive matching with restricted search window (~8x faster stereo)
matching-imu-guided = []
# Temporal consistency: Frame-to-frame depth coherence (~100x faster than RANSAC)
matching-temporal = []
# Hybrid optical flow: Coarse OF + selective stereo (~30% faster)
matching-hybrid-of = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
rerun = "0.25"
image = "0.25"
imageproc = "0.25"
nalgebra = "0.33.2"
nalgebra034 = { package = "nalgebra", version = "0.34.1" } # TODO improve this, now this is dirty (needed for camera-intrinsic-model for now)
rayon = "1.10"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
typed-arena = "2.0"
core_affinity = "0.8"
lazy_static = "1.4"
ndarray = { version = "0.16", optional = true }
ort = { version = "2.0.0-rc.11", optional = true }
pollster = { version = "0.3", optional = true }
wgpu = { version = "0.20", optional = true }
camera-intrinsic-model = "0.7.2"
apex-solver = { git = "https://github.com/amin-abouee/apex-solver", branch = "main" } # TODO change when official release includes the Schur complement methods
faer = "0.23.2"

# Metal GPU acceleration (macOS only) for fast GPU-accelerated workflows
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.4", optional = true }
metal = { version = "0.27", optional = true }
objc2 = { version = "0.5", optional = true }
objc2-foundation = { version = "0.2", optional = true }

[lints.rust]
unsafe_code = "warn"  # Allowed only for SIMD intrinsics (must be documented)
# warnings = "deny"  # Temporarily allowing warnings due to existing codebase issues
non_snake_case = "allow"  # Allow for transformation matrices (T_A_B convention)

[lints.clippy]
# =====================================================================
# CRITICAL SAFETY LINTS - NO EXCEPTIONS
# =====================================================================
unnecessary_unwrap = "deny"
expect_used = "deny"  # NO expect() anywhere - use Result<T> instead
unwrap_used = "deny"  # No unwrap() - must use proper error handling
todo = "deny"  # TODO comments must be resolved before release
unimplemented = "deny"  # No stub implementations
panic = "deny"
exit = "deny"  # Never call process::exit in library code
dbg_macro = "deny"  # No debug prints in production

# =====================================================================
# EMBEDDED SYSTEMS SAFETY - Real-time predictability
# =====================================================================
missing_const_for_fn = "deny"  # All const-eligible functions must be const
inefficient_to_string = "deny"  # Prevent unnecessary allocations
clone_on_copy = "deny"  # No unnecessary clones on Copy types
implicit_clone = "deny"  # Explicit clone() required

# Allocation safety - must be predictable in realtime
large_stack_arrays = "deny"  # Any large stack array is unacceptable
large_types_passed_by_value = "deny"  # Stack pressure must be minimal
vec_box = "deny"  # Double indirection is unacceptable
box_collection = "deny"  # NO Box<Vec<T>> - preallocate or use Vec directly
rc_buffer = "deny"  # NO reference counted buffers in realtime code
let_unit_value = "deny"  # let _ = ... is usually wrong

# =====================================================================
# CORRECTNESS & NUMERIC SAFETY
# =====================================================================
float_cmp = "warn"  # Warn on floating point comparisons (use approx eq)
