[package]
name = "rs-vio"
version = "0.1.0"
edition = "2021"
description = "A high-performance Visual-Inertial Odometry library in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/rs-vio"
documentation = "https://docs.rs/rs-vio"
homepage = "https://github.com/your-org/rs-vio"
keywords = ["computer-vision", "slam", "vio", "odometry", "robotics"]
categories = ["algorithms", "science::robotics", "multimedia::images"]
authors = ["Your Name <your.email@example.com>"]
exclude = [
    "examples/datasets/*",
    "scripts/benchmark_data/*",
    ".github/workflows/benchmarks.yml"
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "signal"] }
serde_json = "1.0"
rerun = "0.25"
image = "0.25"
imageproc = "0.25"
nalgebra = "0.33.2"
nalgebra034 = { package = "nalgebra", version = "0.34.1" } # TODO improve this, now this is dirty (needed for camera-intrinsic-model for now)
rayon = "1.11.0"
camera-intrinsic-model = "0.7.2"
apex-solver = { git = "https://github.com/amin-abouee/apex-solver", branch = "main" } # TODO change when official release includes the Schur complement methods
faer = "0.23.2"

[features]
# Feature flag for using f32 instead of f64 precision
use_f32 = []

[dev-dependencies]
criterion = "0.5"
pprof = { version = "0.13", features = ["flamegraph"] }
arbitrary = "1.3"
proptest = "1.4"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
non_snake_case = "allow"  # Allow for transformation matrices (T_A_B convention)

[lints.clippy]
# Real-time safety lints
unnecessary_unwrap = "deny"
expect_used = "warn"
unwrap_used = "warn"
panic = "deny"
# Performance lints for embedded systems
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
# Correctness lints
float_cmp = "warn"
# indexing_slicing = "warn"  # Too strict for nalgebra usage, matrices are bounds-checked

[profile.release]
# Optimize for embedded/real-time performance
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"  # Reduce binary size and eliminate unwinding overhead
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
