[package]
name = "rs-vio"
version = "0.2.0"
edition = "2021"
description = "A high-performance Visual-Inertial Odometry library in Rust with safety-critical embedded system support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/charleshamesse/RS-VIO"
documentation = "https://docs.rs/rs-vio"
homepage = "https://github.com/charleshamesse/RS-VIO"
keywords = ["computer-vision", "slam", "vio", "odometry", "robotics"]
categories = ["algorithms", "science::robotics", "multimedia::images"]
authors = ["Charles Hamesse"]
exclude = [
    "examples/datasets/*",
    "scripts/benchmark_data/*",
    ".github/workflows/benchmarks.yml"
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
rustfft = "6.2"
rerun = { version = "0.25", optional = true }
# Image crate with optional codec support (only png is required for datasets)
image = { version = "0.25", default-features = false, features = ["png"] }

imageproc = "0.25"
nalgebra = "0.33.2"
nalgebra034 = { package = "nalgebra", version = "0.34.1" }
camera-intrinsic-model = "0.7.2"
rayon = "1.10"  # Parallel iteration for multi-core feature tracking
core_affinity = "0.8"  # Thread pinning support (used on Raspberry Pi)
lazy_static = "1.4"  # For global workspace pool singleton
typed-arena = "2.0"  # Arena allocator for zero-copy feature tracking
tokio = { version = "1.35", features = ["full"] }  # Async runtime for concurrent processing
futures = "0.3"  # Async utilities and combinators
# Note: Using git dependency for apex-solver to access Schur complement methods
# Consider pinning to a specific commit when stable release is available
apex-solver = { git = "https://github.com/amin-abouee/apex-solver", branch = "main" }
# ONNX Runtime for LightGlue inference (optional feature) - requires manual setup
ort = { version = "2.0.0-rc.11", optional = true }
ndarray = { version = "0.16", optional = true }
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }



[features]
default = ["matching-basic-ransac"]
# Feature flag for Rerun.io 3D visualization backend (adds ~30% IR bloat, off by default for lean builds)
rerun-viewer = ["rerun"]
# Feature flag for LightGlue ONNX-based verification
lightglue = ["ort", "ndarray"]
# Feature flag for memory profiling with dhat
dhat-heap = []
# Feature flag for GPU acceleration framework (placeholder for future CUDA/OpenCL support)
gpu = ["wgpu", "pollster", "wgpu/spirv"]
# Feature flag to enable debug/trace logging in hot paths (default off)
debug-logging = []

# === Swarm & Distributed Features ===
# Enable full telemetry and health monitoring for fleet operations
full-telemetry = []
# Enable distributed system types (drone swarms, consensus, etc.)
distributed = []
# Enable both telemetry and distributed features
swarm = ["full-telemetry", "distributed"]
# Enable health checks and readiness probes
health-checks = []

# === Platform-Specific Optimizations ===
# Enable embedded system optimizations (thread pinning, etc.)
embedded = []
# Enable Jetson-specific configurations and optimizations
jetson-optimized = ["embedded"]

# Stereo matching strategies - only one should be enabled per build
# Basic RANSAC: 1000 iterations, standard 8-point algorithm (baseline, default)
matching-basic-ransac = []
# IMU-guided: Predictive matching with restricted search window (~8x faster stereo)
matching-imu-guided = []
# Temporal consistency: Frame-to-frame depth coherence (~100x faster than RANSAC)
matching-temporal = []
# Hybrid optical flow: Coarse OF + selective stereo (~30% faster)
matching-hybrid-of = []

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3"
dhat = "0.3"
libfuzzer-sys = "0.4"

# Calibration verification dependencies
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[[bin]]
name = "calib_check"
path = "src/bin/calib_check.rs"

[package.metadata.cargo-machete]
ignored = ["tracing"]  # Used via tracing-subscriber for structured logging

[lints.rust]
unsafe_code = "warn"  # Allowed only for SIMD intrinsics (must be documented)
warnings = "deny"
non_snake_case = "allow"  # Allow for transformation matrices (T_A_B convention)

[lints.clippy]
# ============================================================================
# CRITICAL SAFETY LINTS - NO EXCEPTIONS
# ============================================================================
unnecessary_unwrap = "deny"
expect_used = "deny"  # NO expect() anywhere - use Result<T> instead
unwrap_used = "deny"  # No unwrap() - must use proper error handling
todo = "deny"  # TODO comments must be resolved before release
unimplemented = "deny"  # No stub implementations
panic = "deny"
exit = "deny"  # Never call process::exit in library code
dbg_macro = "deny"  # No debug prints in production

# ============================================================================
# EMBEDDED SYSTEMS SAFETY - Real-time predictability
# ============================================================================
missing_const_for_fn = "deny"  # All const-eligible functions must be const
inefficient_to_string = "deny"  # Prevent unnecessary allocations
clone_on_copy = "deny"  # No unnecessary clones on Copy types
implicit_clone = "deny"  # Explicit clone() required

# Allocation safety - must be predictable in realtime
large_stack_arrays = "deny"  # Any large stack array is unacceptable
large_types_passed_by_value = "deny"  # Stack pressure must be minimal
vec_box = "deny"  # Double indirection is unacceptable
box_collection = "deny"  # NO Box<Vec<T>> - preallocate or use Vec directly
rc_buffer = "deny"  # NO reference counted buffers in realtime code
let_unit_value = "deny"  # let _ = ... is usually wrong

# ============================================================================
# CORRECTNESS & NUMERIC SAFETY
# ============================================================================
float_cmp = "warn"  # Allow in tests where we know exact values
float_cmp_const = "warn"  # Comparing floats to constants
cast_possible_truncation = "deny"  # Catch truncating casts (lossy with data loss)
cast_precision_loss = "warn"  # Warn on float precision changes (f32↔f64 is common)
cast_sign_loss = "deny"  # Prevent sign loss in casts (critical bug vector)
cast_lossless = "deny"  # Prefer From::from for lossless casts
transmute_ptr_to_ptr = "deny"  # Dangerous transmute patterns

[profile.release]
# Optimize for embedded/real-time performance
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"  # Reduce binary size and eliminate unwinding overhead
strip = true
# Safety: Enable overflow checks even in release (small perf cost for critical safety)
overflow-checks = true
# Keep assertions for runtime validation
debug-assertions = false  # Set to true for extra safety, adds ~3-5% overhead

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Maximum safety profile for safety-critical embedded systems
# Build with: cargo build --profile embedded-safe
[profile.embedded-safe]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false  # Keep symbols for debugging
overflow-checks = true  # Always check integer overflow
debug-assertions = true  # Keep all assertions (~3-5% overhead)
incremental = false  # Best optimization

# Ultra-critical profile for safety-critical systems
# Enables all safety checks + sanitizers
# Build with: RUSTFLAGS="-Z sanitizer=memory" cargo build --profile ultra-critical
[profile.ultra-critical]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug-assertions = true
incremental = false


