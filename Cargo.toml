[package]
name = "rs-vio"
version = "0.2.0"
edition = "2021"
description = "A high-performance Visual-Inertial Odometry library in Rust with safety-critical embedded system support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/charleshamesse/RS-VIO"
documentation = "https://docs.rs/rs-vio"
homepage = "https://github.com/charleshamesse/RS-VIO"
keywords = ["computer-vision", "slam", "vio", "odometry", "robotics"]
categories = ["algorithms", "science::robotics", "multimedia::images"]
authors = ["Charles Hamesse"]
exclude = [
    "examples/datasets/*",
    "scripts/benchmark_data/*",
    ".github/workflows/benchmarks.yml"
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
rerun = "0.25"
image = "0.25"
imageproc = "0.25"
nalgebra = "0.33.2"
nalgebra034 = { package = "nalgebra", version = "0.34.1" } # TODO improve this, now this is dirty (needed for camera-intrinsic-model for now)
camera-intrinsic-model = "0.7.2"
rayon = "1.10"  # Parallel iteration for multi-core feature tracking
# Note: Using git dependency for apex-solver to access Schur complement methods
# Consider pinning to a specific commit when stable release is available
apex-solver = { git = "https://github.com/amin-abouee/apex-solver", branch = "main" }
# ONNX Runtime for LightGlue inference (optional feature) - requires manual setup
ort = { version = "2.0.0-rc.11", optional = true }
ndarray = { version = "0.16", optional = true }
# DHAT heap profiling (optional)
dhat = { version = "0.3.3", optional = true }

[features]
# Feature flag for using f32 instead of f64 precision
use_f32 = []
# Feature flag for LightGlue ONNX-based verification
lightglue = ["ort", "ndarray"]
# Feature flag for heap profiling with DHAT
# Run: cargo test --features dhat -- --test-threads=1
# View results: cat dhat-output.json
dhat = ["dep:dhat"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["tracing"]  # Used via tracing-subscriber for structured logging

[lints.rust]
warnings = "deny"
non_snake_case = "allow"  # Allow for transformation matrices (T_A_B convention)

[lints.clippy]
# =============================================================================
# EMBEDDED DRONE REAL-TIME SAFETY CONFIGURATION
# =============================================================================
# For safety-critical drone VIO, we use the strictest possible lints.
# Only lints that don't interfere with VIO mathematics are set to deny.
# Mathematical operations (casts, float_cmp) are allowed because VIO
# fundamentally requires floating-point computations.

# SAFETY-CRITICAL (DENY) - These must NEVER be bypassed in production code
# Panic prevention: embedded systems cannot panic
panic = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
# Unwrap in hot paths is dangerous for real-time guarantees
unnecessary_unwrap = "deny"

# CORRECTNESS (DENY)
invalid_regex = "deny"

# PERFORMANCE (DENY) - Critical for real-time drone VIO
large_stack_arrays = "deny"      # Stack overflow risk
large_types_passed_by_value = "deny"  # Unnecessary copies
vec_box = "deny"                      # Heap allocation
box_collection = "deny"               # Heap allocation
rc_buffer = "deny"                    # Reference counting overhead

# CODE QUALITY (DENY)
# Prevent subtle bugs
float_cmp = "allow"  # VIO requires float comparisons
# Allow intentional numeric conversions (VIO math)
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
# Allow common patterns in VIO
clone_on_copy = "allow"
redundant_clone = "allow"
unwrap_used = "allow"   # VIO: failure truly exceptional
expect_used = "allow"
assign_op_pattern = "allow"
field_reassign_with_default = "allow"
redundant_pattern_matching = "allow"
len_zero = "allow"
needless_range_loop = "allow"
manual_clamp = "allow"
# Allow common patterns
iter_over_hash_type = "allow"
missing_const_for_fn = "allow"
inefficient_to_string = "allow"
unnecessary_cast = "allow"

# EMBEDDED-SPECIFIC LINTS
# Prevent common embedded mistakes
arithmetic_side_effects = "allow"  # Use checked_arithmetic in hot paths
# Prevent timing issues
suspicious_else_formatting = "allow"
suspicious_open_options = "allow"

[profile.release]
# Optimize for embedded/real-time performance
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"  # Reduce binary size and eliminate unwinding overhead
strip = true
# Safety: Enable overflow checks even in release (small perf cost for critical safety)
overflow-checks = true
# Keep assertions for runtime validation
debug-assertions = false  # Set to true for extra safety, adds ~3-5% overhead

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Maximum safety profile for safety-critical drone systems
# Build with: cargo build --profile embedded-safe
[profile.embedded-safe]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
# Maximum safety: keep all assertions
debug-assertions = true
# Disable incremental for best optimization
incremental = false

# ULTRA-CRITICAL: Zero-overhead safety for drone real-time paths
# Enables additional safety checks + sanitizers
# Build with: RUSTFLAGS="-Z sanitizer=memory" cargo build --profile ultra-critical
[profile.ultra-critical]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug-assertions = true
incremental = false

# Heap profiling profile for DHAT analysis
# Run: cargo test --profile dhat --features dhat
# View: open dhat-output/*.json
[profile.dhat]
inherits = "release"
debug-assertions = true
overflow-checks = true
# Disable optimizations that might confuse DHAT
opt-level = 1

# Test profile - faster compilation for tests
[profile.test]
opt-level = 0
debug = true
lto = "thin"
codegen-units = 4

[[bench]]
name = "estimator"
harness = true

[[bench]]
name = "imu_bench"
harness = false

[[bench]]
name = "optimization"
harness = true

[[bench]]
name = "feature_tracker"
harness = true

[[bench]]
name = "pipeline"
harness = true

[[bench]]
name = "performance_optimizations"
harness = false

[[bench]]
name = "real_world_performance"
harness = false

[[bench]]
name = "loop_closure"
harness = false

# Bare-metal embedded profile for STM32/PX4 drone controllers
# Requires: cargo install cargo-strip
# Build: cargo build --target thumbv7em-none-eabihf --profile bare-metal
[profile.bare-metal]
inherits = "release"
opt-level = "z"  # Optimize for size
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug-assertions = true
incremental = false
