

# Camera Parameters (4Seasons dataset specific)
# Image dimensions and processing parameters
camera:
  image_width: 800            # Image width in pixels (4Seasons standard)
  image_height: 400           # Image height in pixels (4Seasons standard)

  # Left camera (cam0) intrinsics from calibration
  left_intrinsics: [527.9990706330082, 527.963495807245, 399.18451401412665, 172.8193108347693]  # [fx, fy, cx, cy]
  left_distortion: [-0.03559759964255725, -0.005093721310999416, 0.019716282737702494, -0.01583280039499382]  # [k1, k2, p1, p2]
  left_model: "pinhole-equidistant"

  # Right camera (cam1) intrinsics from calibration
  right_intrinsics: [529.2496538273606, 529.4013679656194, 412.4733148308946, 172.1405434152354]  # [fx, fy, cx, cy]
  right_distortion: [-0.03696481607810142, 0.0102400942942071, -0.01632902510720569, 0.009597717025035516]  # [k1, k2, p1, p2]
  right_model: "pinhole-equidistant"

  # Left camera extrinsics (T_cam_imu from calibration)
  T_B_Cl: [-0.9998852242642406, -0.013522961078544133, 0.006831385051241187, 0.17541216744862287,
           -0.006890161859766396, 0.004304637029338462, -0.99996699734021087, 0.0036894333751345677,
           0.01349310815180704, -0.9998992947410829, -0.0043973183521106171, -0.05810612695941222,
           0.0, 0.0, 0.0, 1.0]

  # Right camera extrinsics (T_cam_imu from calibration)
  T_B_Cr: [-0.9999948729203221, -0.00041104034603049364, -0.0031757170690647394, -0.12432919293024627,
           0.003173467277625304, 0.005362979695895791, -0.9999805835886111, 0.0023471917960152505,
           0.0004280636712633416, -0.9999855346426845, -0.005361647776383633, -0.05662052461099226,
           0.0, 0.0, 0.0, 1.0]

# Keyframe and Windowing Parameters
keyframe_management:
  keyframe_window_size: 10
  translation_threshold: 0.05
  rotation_threshold: 0.05
  processing_timeout_ms: 100

# Feature Detection Parameters
feature_detection:
  grid_size: 40
  max_features_per_grid: 1
  optical_flow_max_iterations: 20
  optical_flow_convergence_threshold: 0.01

# Depth Parameters
depth:
  min_depth: 0.1
  max_depth: 1000.0

# Optimization Parameters
optimization:
  pnp_max_iterations: 10
  bundle_adjustment_max_iterations: 20
  # IMU prior integration (constrains latest keyframe pose to IMU prediction)
  imu_prior_enable: true
  imu_prior_weight_pos: 0.5      # Position constraint weight (start conservative)
  imu_prior_weight_rot: 1.0      # Rotation constraint weight
  imu_prior_huber_delta: 1.0     # Robust loss threshold (meters for position, radians for rotation)

# Marginalization settings for sliding window VIO
marginalization:
  enabled: true                     # Enable marginalization of old states
  max_keyframes: 10                 # Maximum number of keyframes in sliding window
  num_marginalize_per_step: 1       # Number of keyframes to marginalize when window is full
  min_landmark_observations: 3      # Minimum observations to keep a landmark
  landmark_age_limit: 50            # Maximum frames without observation before marginalizing
  use_fej: true                     # Use First-Estimate Jacobian for consistency
  damping: 1e-7                     # Damping factor for numerical stability
  prior_info_scale: 0.9             # Scaling factor for information matrix (downweight prior)
  hessian_approximator: "GaussNewton"  # Strategy: GaussNewton, Diagonal, LevenbergMarquardt, Exact, Identity
  gradient_computer: "Standard"     # Strategy: Standard, Zero
  prior_constructor: "Standard"     # Strategy: Standard, Regularized
