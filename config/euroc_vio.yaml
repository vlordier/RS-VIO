# Camera Parameters (EuRoC dataset specific)
# Image dimensions and processing parameters
camera:
  image_width: 752            # Image width in pixels (EuRoC standard)
  image_height: 480           # Image height in pixels (EuRoC standard)

  # Left camera (cam0) intrinsics
  left_intrinsics: [458.654, 457.296, 367.215, 248.375]  # [fx, fy, cx, cy]
  left_distortion: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]  # [k1, k2, p1, p2]
  left_model: "pinhole-radtan"

  # Right camera (cam1) intrinsics
  right_intrinsics: [457.587, 456.134, 379.999, 255.238]  # [fx, fy, cx, cy]
  right_distortion: [-0.28368365, 0.07451284, -0.00010473, -3.55590700e-05]  # [k1, k2, p1, p2]
  right_model: "pinhole-radtan"

  # Left camera extrinsics (T_BC - camera to body transform)
  T_B_Cl: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
            0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768,
            -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
            0.0, 0.0, 0.0, 1.0]

  # Right camera extrinsics (T_BC - camera to body transform)
  T_B_Cr: [0.0125552670891, -0.999755099723, 0.0182237714554, -0.0198435579556,
            0.999598781151, 0.0130119051815, 0.0251588363115, 0.0453689425024,
            -0.0253898008918, 0.0179005838253, 0.999517347078, 0.00786212447038,
            0.0, 0.0, 0.0, 1.0]

visualization:
  enable_viewer: false        # Disable viewer for faster processing

# Keyframe management configuration
keyframe_management:
  keyframe_window_size: 10    # Maximum number of keyframes in sliding window
  translation_threshold: 0.2  # Minimum translation (meters) for new keyframe
  rotation_threshold: 5.0     # Minimum rotation (degrees) for new keyframe
  processing_timeout_ms: 50   # Maximum allowed processing time per frame

# Feature detection parameters
feature_detection:
  grid_size: 30               # Number of grid columns for feature distribution
  max_features_per_grid: 200  # Maximum features per grid cell
  optical_flow_max_iterations: 30
  optical_flow_convergence_threshold: 0.005

# Bundle adjustment optimization settings
optimization:
  bundle_adjustment_max_iterations: 20
  pnp_max_iterations: 10
  imu_prior_enable: true
  imu_prior_weight_pos: 0.5
  imu_prior_weight_rot: 1.0
  imu_prior_huber_delta: 1.0

# Marginalization settings for sliding window VIO
marginalization:
  enabled: true                     # Enable marginalization of old states
  max_keyframes: 10                 # Maximum number of keyframes in sliding window
  num_marginalize_per_step: 1       # Number of keyframes to marginalize when window is full
  min_landmark_observations: 3      # Minimum observations to keep a landmark
  landmark_age_limit: 50            # Maximum frames without observation before marginalizing
  use_fej: true                     # Use First-Estimate Jacobian for consistency
  damping: 1e-7                     # Damping factor for numerical stability
  prior_info_scale: 0.9             # Scaling factor for information matrix (downweight prior)
  hessian_approximator: "GaussNewton"  # Strategy: GaussNewton, Diagonal, LevenbergMarquardt, Exact, Identity
  gradient_computer: "Standard"     # Strategy: Standard, Zero
  prior_constructor: "Standard"     # Strategy: Standard, Regularized
