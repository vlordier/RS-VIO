# Multi-Frame Fusion Configuration
# This file demonstrates how to configure the pluggable fusion strategies
# for improving VIO tracking quality and robustness.

# Fusion strategy selection
fusion:
  # Available strategies: "none", "rotation", "depth-aware"
  # - none: Disable fusion (baseline)
  # - rotation: IMU-driven rotation-only stabilization
  # - depth-aware: Selective patch fusion using sparse depth
  strategy: rotation

  # Logging: enable to log fusion metrics per frame
  log_metrics: true

  # Rotation stabilizer configuration
  # Uses IMU gyroscope to warp and accumulate multi-frame patches,
  # improving robustness to hand tremor and sensor noise
  rotation_stabilizer:
    # Number of frames to fuse (typically 3-5)
    # More frames: better noise reduction, higher latency
    # Recommended: 3-4 for real-time, 5-7 for offline processing
    num_frames: 3

    # Minimum rotation to trigger fusion (radians)
    # Skip fusion if camera rotation < this threshold
    # Typical: 0.005-0.02 (0.3-1.2 degrees)
    min_rotation_threshold: 0.01

    # Weighting strategy for frame accumulation
    # - "uniform": Equal weight to all N frames
    # - "exponential": Recent frames weighted more heavily
    # - "sharpness-adaptive": Weight by local image sharpness
    weighting_strategy: exponential

  # Depth-aware fusion configuration
  # Uses sparse stereo depth to selectively enhance low-texture patches
  # Improves quality without affecting well-tracked regions
  depth_aware_fusion:
    # Number of frames for multi-frame fusion (typically 2-4)
    num_frames: 3

    # Texture confidence threshold [0-1]
    # Patches with confidence < threshold undergo fusion
    # Typical: 0.5-0.7 (fuse lower-confidence patches)
    texture_confidence_threshold: 0.6

    # Depth hypothesis search range as fraction of estimated depth
    # Typical: 0.15-0.25 (±15-25% around estimated depth)
    depth_hypothesis_range: 0.2

    # Number of depth hypotheses to test during fusion
    # More hypotheses: more accurate but slower
    # Typical: 3-7
    num_depth_hypotheses: 5

# Integration notes:
#
# 1. ROTATION STABILIZER
#    - Best for: Handheld cameras, sensor noise, IMU-enabled devices
#    - Impact: 10-20% fewer tracking failures, smoother trajectories
#    - Cost: 5-15ms per frame
#    - Recommended settings for EuRoC: num_frames=3, weighting=exponential
#
# 2. DEPTH-AWARE FUSION
#    - Best for: Stereo systems, texture-poor scenes, refinement of bundle adjustment
#    - Impact: 5-10% accuracy improvement in low-texture regions
#    - Cost: 2-5ms per frame (sparse depth points)
#    - Recommended settings: num_frames=3, confidence_threshold=0.6
#
# 3. COMBINED STRATEGY
#    - For maximum quality, apply rotation stabilizer first (frame quality)
#    - Then apply depth-aware fusion (feature confidence)
#    - Typical combined cost: 20-25ms per frame
#
# 4. TUNING GUIDELINES
#    - Start with rotation stabilizer (less risky)
#    - Validate on test sequences before deploying
#    - Adjust num_frames based on camera frame rate:
#      - 30 FPS: num_frames=3-4 (100-130ms window)
#      - 60 FPS: num_frames=5-7 (80-115ms window)
#    - Use exponential weighting for real-time (emphasizes recent frames)
#    - Use sharpness-adaptive for offline quality (best fusion)
#
# 5. MONITORING
#    - Enable log_metrics to track fusion effectiveness
#    - Monitor: num_frames_used, computation_time_ms, snr_improvement_db
#    - If computation_time_ms consistently > 20ms on your hardware, reduce num_frames
