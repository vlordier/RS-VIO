
# Debug / Feature Toggle Flags
# Set to false to disable features for debugging
debug:
  use_imu: true                    # Enable IMU integration (try false if having issues)
  use_feature_tracking: true       # Enable stereo feature tracking
  use_triangulation: true          # Enable stereo triangulation
  use_fallback_depth: true         # ENABLED: Use fallback depth to seed map when triangulation fails
  min_stereo_matches: 1            # RELAXED: Minimum matching features for triangulation (was 2)
  log_stereo_undistorted: false    # Disabled to reduce logging overhead

# Camera Parameters (TUM-VI dataset - from dso/camchain.yaml)
# TUM-VI uses pinhole camera model with equidistant distortion
camera:
  image_width: 512            # Image width in pixels
  image_height: 512           # Image height in pixels

  # Left camera (cam0) intrinsics - from TUM-VI calibration
  # Using OpenCV5 model to approximate equidistant distortion
  left_intrinsics: [190.97847715128717, 190.9733070521226, 254.93170605935475, 256.8974428996504]
  left_distortion: [0.0034823894022493434, 0.0007150348452162257, -0.0020532361418706202, 0.00020293673591811182, 0.0]
  left_model: "opencv5"


  # Right camera (cam1) intrinsics - from TUM-VI calibration
  right_intrinsics: [190.44236969414825, 190.4344384721956, 252.59949716835982, 254.91723064636983]
  right_distortion: [0.0034003170790442797, 0.001766278153469831, -0.00266312569781606, 0.0003299517423931039, 0.0]
  right_model: "opencv5"

  # Left camera extrinsics (T_B_Cl = inverse of T_cam0_imu from DSO camchain.yaml)
  T_B_Cl: [-0.99952504, 0.00750192, -0.02989013, 0.04557484, 0.02961534, -0.03439736, -0.99896935, -0.07116180, -0.00852233, -0.99938008, 0.03415885, -0.04468125, 0.0, 0.0, 0.0, 1.0]

  # Right camera extrinsics (T_B_Cr = inverse of T_cam1_imu from DSO camchain.yaml)
  T_B_Cr: [-0.99951105, 0.00810408, -0.03019914, -0.05545634, 0.03029912, 0.01251164, -0.99946257, -0.06925002, -0.00772188, -0.99988889, -0.01275107, -0.04745286, 0.0, 0.0, 0.0, 1.0]

# Keyframe and Windowing Parameters
# Controls keyframe selection and sliding window management
keyframe_management:
  keyframe_window_size: 20
  translation_threshold: 0.03  # Minimum translation (meters) since last keyframe to trigger new keyframe (more aggressive to densify keyframes)
  rotation_threshold: 0.03  # Minimum rotation (radians) since last keyframe to trigger new keyframe (more aggressive to densify keyframes)
  processing_timeout_ms: 20000

# Feature Detection Parameters
# Controls how corner features are detected using goodFeaturesToTrack
feature_detection:
  grid_size: 20               # REDUCED: Smaller grid for more uniform coverage (was 24)
  max_features_per_grid: 6    # BALANCED: Features per cell to avoid timeout (was 8)
  optical_flow_max_iterations: 15  # INCREASED: More iterations for better tracking (was 10)
  optical_flow_convergence_threshold: 0.015  # RELAXED: Allow slightly less precise tracking (was 0.01)

# Global Depth Parameters
# Controls depth validation throughout the entire VIO system
depth:
  min_depth: 0.05             # RELAXED: Minimum depth for valid 3D points (was 0.1m)
  max_depth: 50.0             # TIGHTENED: Maximum depth to reject far outliers (was 100m)

optimization:
  pnp_max_iterations: 10
  bundle_adjustment_max_iterations: 20
  # IMU prior integration (constrains latest keyframe pose to IMU prediction)
  imu_prior_enable: true
  imu_prior_weight_pos: 0.5      # Position constraint weight (start conservative)
  imu_prior_weight_rot: 1.0      # Rotation constraint weight
  imu_prior_huber_delta: 1.0     # Robust loss threshold (meters for position, radians for rotation)

# Marginalization settings for sliding window VIO
marginalization:
  enabled: true                     # Enable marginalization of old states
  max_keyframes: 20                 # Maximum number of keyframes in sliding window
  num_marginalize_per_step: 1       # Number of keyframes to marginalize when window is full
  min_landmark_observations: 3      # Minimum observations to keep a landmark
  landmark_age_limit: 50            # Maximum frames without observation before marginalizing
  use_fej: true                     # Use First-Estimate Jacobian for consistency
  damping: 1e-7                     # Damping factor for numerical stability
  prior_weight: 1.0                 # Weight for marginalization prior
  prior_info_scale: 1.0           # Scaling factor for information matrix
  hessian_approximator: "GaussNewton"  # Strategy: GaussNewton, Diagonal, LevenbergMarquardt, Exact, Identity
  gradient_computer: "Standard"     # Strategy: Standard, Zero
  prior_constructor: "Standard"     # Strategy: Standard, Regularized
