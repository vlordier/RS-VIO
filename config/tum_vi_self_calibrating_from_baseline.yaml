%YAML:1.0
---

# Baseline intrinsics + online refinement enabled
camera:
  image_width: 512
  image_height: 512

  # Left camera (baseline intrinsics)
  left_intrinsics: [191.75556798912652, 191.74816751185256, 254.9226487139376, 256.8780365577954]
  left_distortion: [0.6246288732884442, 1.0598071085569876]
  left_model: "EUCM"

  # Right camera (baseline intrinsics)
  right_intrinsics: [191.12575044002125, 191.1082274072055, 252.55828522469696, 255.0183218515494]
  right_distortion: [0.6246035984060496, 1.0565986975905006]
  right_model: "EUCM"

  # Left camera extrinsics (T_BC - camera to body transform)
  T_B_Cl: [-0.99954072 , 0.00741901 ,-0.02938199 , 0.04644611,   0.02910045, -0.03556579, -0.99894356, -0.07105542,  -0.00845616, -0.9993398 ,  0.03533356 ,-0.04342594, 0.        ,  0. ,         0.  ,        1. ]

  # Right camera extrinsics (T_BC - camera to body transform)
  T_B_Cr: [-0.99953336,  0.00802045, -0.02947447, -0.054498, 0.02956376,  0.01125166, -0.99949957, -0.06910442,-0.0076848 , -0.99990453, -0.01148352, -0.04518668,0.,0., 0.,   1.]

keyframe_management:
  keyframe_window_size: 10
  translation_threshold: 0.4
  rotation_threshold: 0.25

feature_detection:
  grid_size: 30
  max_features_per_grid: 1
  optical_flow_max_iterations: 10
  optical_flow_convergence_threshold: 0.01

optimization:
  pnp_max_iterations: 10
  bundle_adjustment_max_iterations: 20

calibration:
  optimize_intrinsics: true
  optimize_focal_length: true
  optimize_principal_point: false
  optimize_distortion: false
  intrinsics_refinement_frequency: 5
  max_intrinsics_change_per_update: 0.5
  intrinsics_regularization_weight: 0.01
