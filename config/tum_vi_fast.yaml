# Fast-profile TUM-VI config for high-throughput benchmarking
# Prioritizes speed over peak accuracy; suitable for ROI runs

debug:
  use_imu: true
  use_feature_tracking: true
  use_triangulation: true
  use_fallback_depth: false        # disable expensive fallback depth path
  min_stereo_matches: 2            # require minimal stereo matches
  log_stereo_undistorted: false

camera:
  image_width: 512
  image_height: 512
  left_intrinsics: [190.97847715128717, 190.9733070521226, 254.93170605935475, 256.8974428996504]
  left_distortion: [0.0034823894022493434, 0.0007150348452162257, -0.0020532361418706202, 0.00020293673591811182, 0.0]
  left_model: "opencv5"

  right_intrinsics: [190.44236969414825, 190.4344384721956, 252.59949716835982, 254.91723064636983]
  right_distortion: [0.0034003170790442797, 0.001766278153469831, -0.00266312569781606, 0.0003299517423931039, 0.0]
  right_model: "opencv5"

  T_B_Cl: [-0.99952504, 0.00750192, -0.02989013, 0.04557484, 0.02961534, -0.03439736, -0.99896935, -0.07116180, -0.00852233, -0.99938008, 0.03415885, -0.04468125, 0.0, 0.0, 0.0, 1.0]
  T_B_Cr: [-0.99951105, 0.00810408, -0.03019914, -0.05545634, 0.03029912, 0.01251164, -0.99946257, -0.06925002, -0.00772188, -0.99988889, -0.01275107, -0.04745286, 0.0, 0.0, 0.0, 1.0]

keyframe_management:
  keyframe_window_size: 10          # smaller window
  translation_threshold: 0.08       # fewer keyframes
  rotation_threshold: 0.08
  processing_timeout_ms: 5000

feature_detection:
  grid_size: 16                     # fewer grid cells
  max_features_per_grid: 4          # fewer features per cell
  optical_flow_max_iterations: 10   # faster OF
  optical_flow_convergence_threshold: 0.02

depth:
  min_depth: 0.1
  max_depth: 50.0

optimization:
  pnp_max_iterations: 5             # faster PnP
  bundle_adjustment_max_iterations: 5  # faster BA
  imu_prior_enable: true
  imu_prior_weight_pos: 0.5
  imu_prior_weight_rot: 1.0
  imu_prior_huber_delta: 1.0

marginalization:
  enabled: true
  max_keyframes: 12                 # smaller sliding window
  num_marginalize_per_step: 1
  min_landmark_observations: 3
  landmark_age_limit: 40
  use_fej: true
  damping: 1e-7
  prior_weight: 1.0
  prior_info_scale: 1.0
  hessian_approximator: "Diagonal"   # faster approximator
  gradient_computer: "Standard"
  prior_constructor: "Standard"
