%YAML:1.0
---

# Strategy 1 & 2: Longer dataset + Online intrinsics refinement
# For improved calibration accuracy

camera:
  image_width: 512
  image_height: 512

  # Left camera (cam0) intrinsics - starting point from TUM-VI
  left_intrinsics: [190.97847715128717, 190.9733070521226, 254.93170605935475, 256.8974428996504]
  left_distortion: [0.0034823894022493434, 0.0007150348452162257, -0.0020532361418706202, 0.00020293673591811182, 0.0]
  left_model: "opencv5"

  # Right camera (cam1) intrinsics - starting point from TUM-VI
  right_intrinsics: [190.44236969414825, 190.4344384721956, 252.59949716835982, 254.91723064636983]
  right_distortion: [0.0034003170790442797, 0.001766278153469831, -0.00266312569781606, 0.0003299517423931039, 0.0]
  right_model: "opencv5"

  # Left camera extrinsics (T_B_Cl = inverse of T_cam0_imu from DSO camchain.yaml)
  T_B_Cl: [-0.99952504, 0.00750192, -0.02989013, 0.04557484, 0.02961534, -0.03439736, -0.99896935, -0.07116180, -0.00852233, -0.99938008, 0.03415885, -0.04468125, 0.0, 0.0, 0.0, 1.0]

  # Right camera extrinsics (T_B_Cr = inverse of T_cam1_imu from DSO camchain.yaml)
  T_B_Cr: [-0.99951105, 0.00810408, -0.03019914, -0.05545634, 0.03029912, 0.01251164, -0.99946257, -0.06925002, -0.00772188, -0.99988889, -0.01275107, -0.04745286, 0.0, 0.0, 0.0, 1.0]

# Keyframe and Windowing Parameters
keyframe_management:
  keyframe_window_size: 15          # Larger window for better BA
  translation_threshold: 0.2        # More liberal for longer dataset
  rotation_threshold: 0.15

# Feature Detection Parameters
feature_detection:
  grid_size: 25
  max_features_per_grid: 2
  optical_flow_max_iterations: 15
  optical_flow_convergence_threshold: 0.01

# Global Depth Parameters
depth:
  min_depth: 0.1
  max_depth: 100.0

# Optimization Parameters
optimization:
  pnp_max_iterations: 10
  bundle_adjustment_max_iterations: 20

# STRATEGY 2: Online intrinsics refinement
# This enables automatic focal length optimization during VIO
calibration:
  optimize_intrinsics: true           # Enable online refinement
  optimize_focal_length: true         # Refine fx, fy
  optimize_principal_point: false     # Keep cx, cy fixed (more stable)
  optimize_distortion: false          # Keep distortion fixed
  intrinsics_refinement_frequency: 5  # Refine every 5 keyframes
  max_intrinsics_change_per_update: 0.5  # Max 0.5 pixel change (regularization)
  intrinsics_regularization_weight: 0.01  # 1% regularization to original values
