name: Monthly Dependency & Hook Updates

on:
  schedule:
    # Run on the first Monday of each month at 9 AM UTC
    - cron: '0 9 1-7 * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Update pre-commit hooks
        run: pre-commit autoupdate

      - name: Check if changes exist
        id: check
        run: |
          git diff --quiet .pre-commit-config.yaml || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update pre-commit hooks'
          title: 'chore: Monthly pre-commit hooks update'
          body: |
            ## Monthly Pre-Commit Update

            This PR automatically updates pre-commit hooks to their latest versions.

            ### Changes
            - Updated hook versions in `.pre-commit-config.yaml`

            ### Testing
            - [ ] Run `pre-commit run --all-files` locally to verify
            - [ ] Review hook changes for breaking changes
            - [ ] Run full CI pipeline

            Generated by [Monthly Dependency & Hook Updates](.github/workflows/monthly-update.yml) workflow.
          branch: chore/monthly-pre-commit-update
          delete-branch: true

  update-cargo-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Update Cargo dependencies
        run: cargo update --aggressive

      - name: Check if changes exist
        id: check
        run: |
          git diff --quiet Cargo.lock || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update Cargo dependencies'
          title: 'chore: Monthly Cargo dependencies update'
          body: |
            ## Monthly Cargo Update

            This PR automatically updates all Cargo dependencies to their latest patch and minor versions.

            ### Changes
            - Updated dependencies in `Cargo.lock`

            ### Testing
            - [ ] Run `cargo test --all` locally to verify
            - [ ] Review dependency changes for breaking changes
            - [ ] Run full CI pipeline to ensure compatibility

            Generated by [Monthly Dependency & Hook Updates](.github/workflows/monthly-update.yml) workflow.
          branch: chore/monthly-cargo-update
          delete-branch: true

  update-github-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Actions
        run: |
          # Update all GitHub Actions to latest minor versions
          find .github/workflows -name '*.yml' -o -name '*.yaml' | xargs sed -i \
            's/@v[0-9]\+$/@v4/g' \
            's/@v[0-9]\+\.[0-9]\+$/@v5/g'

      - name: Check if changes exist
        id: check
        run: |
          git diff --quiet .github/workflows || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update GitHub Actions versions'
          title: 'chore: Monthly GitHub Actions update'
          body: |
            ## Monthly GitHub Actions Update

            This PR automatically updates GitHub Actions to their latest stable versions.

            ### Changes
            - Updated action versions in `.github/workflows/*.yml`

            ### Testing
            - [ ] Verify all workflows still work correctly
            - [ ] Check action release notes for breaking changes

            Generated by [Monthly Dependency & Hook Updates](.github/workflows/monthly-update.yml) workflow.
          branch: chore/monthly-actions-update
          delete-branch: true
