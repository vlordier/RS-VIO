# Cargo configuration for RS-VIO build system

[build]
# Incremental compilation cache (enabled by default in dev).
# Avoid setting this globally here, as it can override profile-level `incremental = false`
# (e.g., in `[profile.release]`). Prefer per-profile settings in Cargo.toml or
# the CARGO_INCREMENTAL env var for local development.
# incremental = true

# Use faster linker on macOS (if lld is installed: brew install llvm)
# Uncomment if lld is available
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
