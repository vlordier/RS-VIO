# Cargo configuration for RS-VIO build system

[build]
# Incremental compilation cache (enabled by default in dev)
incremental = true

# Use faster linker on macOS (if lld is installed: brew install llvm)
# Uncomment if lld is available
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
